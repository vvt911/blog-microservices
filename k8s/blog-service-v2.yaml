# Blog Service V2 Deployment for Traffic Routing Demo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-service-v2
  namespace: blog-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-service
      version: v2
  template:
    metadata:
      labels:
        app: blog-service
        version: v2
    spec:
      containers:
      - name: blog-service
        image: blog-service:v2
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service:3004"
        - name: SERVICE_VERSION
          value: "v2"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
